services:
  app:
    build: .
    container_name: redirect-capture
    # Puerto 3000: SOLO interno (red de compose y localhost del host).
    # Trafico externo entra por 443 (Caddy) -> red interna -> app:3000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-cambiar-en-produccion}
      DEFAULT_DESTINATION_URL: ${DEFAULT_DESTINATION_URL:-https://www.google.com}
      DATA_DIR: /data
    volumes:
      - app-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    profiles: ["production"]
    # Puerto 443 (y 80 para redirigir a HTTPS): los UNICOS publicos hacia afuera.
    # Termina TLS (Let's Encrypt) y redirige a la app por la red interna en 3000.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config: