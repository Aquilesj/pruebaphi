<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de administración</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div id="loginView" hidden>
      <div class="card login-card">
        <h1>Acceso administrador</h1>
        <form id="loginForm">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="username" required>
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
          <p class="error" id="loginError"></p>
          <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
      </div>
    </div>

    <div id="dashboardView" hidden>
      <header class="topbar">
        <h1>Panel de administración</h1>
        <div class="topbar-actions">
          <span id="currentUser"></span>
          <button type="button" id="logoutBtn" class="btn">Cerrar sesión</button>
        </div>
      </header>

      <section class="card">
        <h2>Redirección</h2>
        <form id="settingsForm">
          <label for="destinationUrl">URL de destino</label>
          <input type="url" id="destinationUrl" placeholder="https://ejemplo.com" required>
          <label for="entryToken">Token del enlace de entrada</label>
          <input type="text" id="entryToken" placeholder="x7Kp9Q2m" minlength="4" maxlength="64" required>
          <p class="hint">El enlace de captura será: /r/&lt;token&gt;</p>
          <p class="success" id="settingsMsg"></p>
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
      </section>

      <section class="card">
        <h2>Capturas <span class="badge" id="totalBadge">0</span></h2>
        <div id="emptyState" hidden>
          <p>No hay capturas todavía.</p>
        </div>
        <div id="grid" class="grid"></div>
        <div class="pagination">
          <button type="button" id="prevPage" class="btn">← Anterior</button>
          <span id="pageInfo"></span>
          <button type="button" id="nextPage" class="btn">Siguiente →</button>
        </div>
      </section>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
